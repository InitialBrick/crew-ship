<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
canvas{display:block}

#bubble b{display:block;margin-bottom:4px}#bubble a{display:inline-block;margin-top:8px;background:#5b6cff;color:#fff;padding:7px 12px;border-radius:10px;text-decoration:none;font-weight:600}
#panel{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,360px);max-height:70vh;overflow:auto;background:#fff8e6;color:#222;border:5px solid #a0764a;border-radius:16px;padding:14px;z-index:30;box-shadow:0 10px 30px #000a}

.lbl{position:fixed;font-size:11px;font-weight:800;background:#0009;padding:1px 6px;border-radius:7px;pointer-events:none;transform:translate(-50%,-100%);white-space:nowrap;z-index:5}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>

<div id="hud">
<div class="pill big">💰 <span id="ptot">$0.00</span></div>
<div class="pill">🛍️ Etsy <span id="pE">$0</span></div><div class="pill">🎵 TikTok <span id="pT">$0</span></div><div class="pill">✨ Other <span id="pO">$0</span></div>

<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color('#0b1030');

S.add(new THREE.HemisphereLight('#dfe8ff','#3a3060',1.6));const sun=new THREE.DirectionalLight('#fff',1.6);sun.position.set(20,40,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-25,right:25,top:25,bottom:-25});S.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true});
const box=(w,h,d,c,x,y,z,p=S)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p.add(m);return m};
// space
const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<900;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(150+Math.random()*100);sp.push(v.x,v.y,v.z)}sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:'#fff',size:.8}));S.add(stars);
const planets=[['#ff9a5c',9,-70,-20,-60],['#7fe0c8',5,60,-10,-40],['#b48cff',14,-30,-35,90]].map(([c,r,x,y,z])=>{const p=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),M(c));p.position.set(x,y,z);S.add(p);return p});

const ship=new THREE.Group();S.add(ship);
const hull=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1.2,12),M('#dfe6f5'));hull.scale.set(20,1,14);hull.position.y=-.6;hull.receiveShadow=true;ship.add(hull);
const under=new THREE.Mesh(new THREE.ConeGeometry(1,1,12),M('#9aa6c8'));under.scale.set(20,4,14);under.rotation.x=Math.PI;under.position.y=-3.2;ship.add(under);
const nose=new THREE.Mesh(new THREE.ConeGeometry(4,8,8),M('#ff6b6b'));nose.rotation.z=-Math.PI/2;nose.position.set(23,-.5,0);ship.add(nose);
[[-1],[1]].forEach(([s])=>{box(8,.6,5,'#ff6b6b',-14,-.4,s*15,ship)});
const flame=new THREE.Mesh(new THREE.ConeGeometry(2.4,7,8),new THREE.MeshBasicMaterial({color:'#ffb02e'}));flame.rotation.z=Math.PI/2;flame.position.set(-24,-.5,0);ship.add(flame);
const rim=new THREE.Mesh(new THREE.TorusGeometry(1,.04,6,24),M('#8a95b5'));rim.scale.set(20,14,20);rim.rotation.x=Math.PI/2;ship.add(rim);
const ROOMS={common:[0,0,9,7,'#e9d9b8'],studio:[0,-9.5,9,6,'#3a2b5c'],comms:[0,9.5,9,6,'#1f4d4a'],design:[-12,0,8,8,'#c94f7c'],bridge:[12,0,8,8,'#2b3a67']};
for(const k in ROOMS){const[x,z,w,d,c]=ROOMS[k];box(w,.2,d,c,x,.1,z,ship);
 const wall=(W,D,X,Z)=>box(W,1.2,D,'#f4f6ff',X,.7,Z,ship);const g=1.4;
 // N/S walls (z sides), E/W walls (x sides) with door gaps toward center
 [[-1,'z'],[1,'z'],[-1,'x'],[1,'x']].forEach(([s,a])=>{const len=a=='z'?w:d;const px=a=='z'?x:x+s*w/2,pz=a=='z'?z+s*d/2:z;
  const toward=a=='z'?(k=='common'||(s>0&&z<0)||(s<0&&z>0)):(k=='common'||(s>0&&x<0)||(s<0&&x>0));
  const door=toward&&(k=='common'?(a=='z'||true):true);const seg=(len-g*2)/2;
  if(!door){a=='z'?wall(len,.3,px,pz):wall(.3,len,px,pz)}else{const o=g+seg/2;a=='z'?(wall(seg,.3,px-o,pz),wall(seg,.3,px+o,pz)):(wall(.3,seg,px,pz-o),wall(.3,seg,px,pz+o))}});}
box(2.6,.15,3.2,'#cfd5e8',0,.08,-5,ship);box(2.6,.15,3.2,'#cfd5e8',0,.08,5,ship);box(3.6,.15,2.6,'#cfd5e8',-6.3,.08,0,ship);box(3.6,.15,2.6,'#cfd5e8',6.3,.08,0,ship);
// props
const tbl=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,.8,10),M('#8a95b5'));tbl.position.set(0,.6,.8);tbl.castShadow=true;ship.add(tbl);
const board=box(3,1.8,.25,'#a0764a',0,1.5,-3.2,ship);[['#fff',-.8],['#ffe08a',0],['#9ef0d5',.8]].forEach(([c,o])=>box(.6,.7,.05,c,o,1.6,-3.05,ship));board.userData.board=1;
box(3,1.6,.3,'#111',-2,1.2,-12,ship);box(3,1.6,.3,'#111',2,1.2,-12,ship);box(2.6,1.2,.05,'#7dffb0',-2,1.2,-11.83,ship);box(2.6,1.2,.05,'#ff6bd6',2,1.2,-11.83,ship);
const clk=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.3,12),M('#fff'));clk.rotation.x=Math.PI/2;clk.position.set(-2.5,1.3,12.2);ship.add(clk);box(2.4,1.8,.3,'#fff',2,1.2,12.2,ship);box(2.4,.4,.32,'#ff6b6b',2,1.95,12.2,ship);
const tube=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,3,8),new THREE.MeshLambertMaterial({color:'#9ad0ff',transparent:true,opacity:.7}));tube.position.set(3.8,1.5,8);ship.add(tube);
box(3,.9,1.6,'#a0764a',-12,.55,2,ship);box(1,.05,1.3,'#fff',-12.6,1.05,2,ship);box(1,.05,1.3,'#ffd34d',-11.4,1.05,2,ship);box(.2,2,3,'#c94f7c',-15.7,1.2,-1.5,ship);
box(1.4,1.2,1.4,'#ffd34d',13.5,.7,0,ship);box(.6,1.6,4,'#5b6cff',15.5,.9,0,ship);box(.2,1.6,2.4,'#fff',8.3,1.1,-2.5,ship);
// crew
const CREW=[
{n:'Pip',id:'d1d562e8-8e61-4836-890f-501af6a8fb51',home:'bridge',c:'#5b6cff',hat:'cap',lines:["Captain on deck! What's the mission?","Task board's looking good today.","Keeping the crew on course.","Steady as she goes."]},
{n:'Venture',id:'512f2eb0-3d6f-41df-8245-91b5d665bc3c',home:'studio',c:'#ff6bd6',hat:'tie',lines:["Trivia O'Clock: guess before the timer!","Hook in the first second, always.","Checking today's views and follows.","Growth is a daily habit."]},
{n:'Relay',id:'4926bc8f-2560-4bb4-8a1b-d155fdad3523',home:'comms',c:'#4fd1a5',hat:'head',lines:["Your calendar's under control.","Got a reminder queued up for you.","Mail tube is clear!","Want me to schedule something?"]},
{n:'Pixel',id:'72215629-4232-4aaf-ba34-dca662381357',home:'design',c:'#ffb02e',hat:'beret',lines:["BricksPrints is open for business!","Fresh pins going up on Pinterest.","Designing the next printable.","Moving checklist is next on the list."]}];
const DOOR={common:[0,0],studio:[0,-6],comms:[0,6],design:[-8,0],bridge:[8,0]};
const hits=[board];
CREW.forEach(b=>{const g=new THREE.Group();box(1,1,.7,b.c,0,.9,0,g);box(.9,.8,.8,'#ffe2c4',0,1.85,0,g);box(.12,.12,.05,'#222',-.2,1.9,.41,g);box(.12,.12,.05,'#222',.2,1.9,.41,g);
 b.legs=[box(.35,.5,.4,'#334',-.25,.25,0,g),box(.35,.5,.4,'#334',.25,.25,0,g)];
 if(b.hat=='cap'){box(1,.35,1,'#223',0,2.4,0,g);box(.3,.2,.05,'#ffd34d',0,2.4,.5,g)}if(b.hat=='tie')box(.2,.6,.05,'#c22',0,1,.37,g);
 if(b.hat=='head'){box(1.1,.15,.2,'#333',0,2.33,0,g);box(.15,.4,.4,'#333',-.5,1.9,0,g)}if(b.hat=='beret')box(1.1,.25,1.1,'#c94f7c',.1,2.38,0,g);
 g.traverse(o=>o.userData.bot=b);ship.add(g);b.g=g;hits.push(g);b.room=b.home;const[x,z]=ROOMS[b.home];g.position.set(x+(Math.random()-.5)*3,.2,z+(Math.random()-.5)*2);b.path=[];
 const l=document.createElement('div');l.className='lbl';l.textContent=b.n;document.body.appendChild(l);b.lbl=l});
function go(b,room){if(!ROOMS[room])room=b.home;const[x,z,w,d]=ROOMS[room];const t=[x+(Math.random()-.5)*(w-3),z+(Math.random()-.5)*(d-3)];
 b.path=b.room==room?[t]:[DOOR[b.room],DOOR.common,DOOR[room],t];b.room=room}
// talk lines
const links=[];function link(a,b){const m=new THREE.LineBasicMaterial({color:'#7fe9ff',transparent:true});const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),m);ship.add(ln);links.push({ln,a,b,t:0})}
setInterval(()=>{const b=CREW[Math.random()*4|0];if(b.path.length)return;const r=Math.random();
 if(r<.35){const o=CREW[Math.random()*4|0];if(o!==b){go(b,o.room);b.meet=o}}else if(r<.5)go(b,'common');else go(b,r<.75?b.home:b.room)},3000);
// interaction
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();let down;
R.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
R.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;bubble.style.display='none';
 pt.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pt,cam);const h=ray.intersectObjects(hits,true)[0];if(!h)return;
 let o=h.object;while(o&&!o.userData.bot&&!o.userData.board)o=o.parent;if(!o)return;if(o.userData.board)return openBoard();const b=o.userData.bot;
 bubble.innerHTML=`<b>${b.n}</b>${b.lines[Math.random()*b.lines.length|0]}<br><a href="grokbot://app/v1/agent?id=${b.id}">Talk to ${b.n}</a>`;bubble.style.display='block';
 bubble.style.left=Math.max(8,Math.min(innerWidth-270,e.clientX-120))+'px';bubble.style.top=Math.max(90,e.clientY-140)+'px'});
let ACT=[];function openBoard(){const L=ACT.filter(x=>x.type=='accomplishment');acc.innerHTML=L.length?L.map(x=>`<div style="margin-top:10px;padding:8px;background:#fff;border-radius:8px">🏆 <b>${x.text}</b><br><small>${x.bot} · ${new Date(x.time).toLocaleDateString()}</small></div>`).join(''):'<p>No accomplishments yet.</p>';panel.style.display='block'}
// loop
const clock=new THREE.Clock(),v=new THREE.Vector3(),wv=new THREE.Vector3();
R.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 ship.position.y=Math.sin(t*1.2)*.6;ship.rotation.z=Math.sin(t*.8)*.02;ship.rotation.x=Math.sin(t*.6)*.015;flame.scale.y=1+Math.sin(t*20)*.15;
 stars.rotation.y+=dt*.01;planets.forEach((p,i)=>{p.position.x+=dt*(2+i);if(p.position.x>120)p.position.x=-120;p.rotation.y+=dt*.2});
 let working=0;CREW.forEach(b=>{const g=b.g;if(b.path.length){const[tx,tz]=b.path[0];const dx=tx-g.position.x,dz=tz-g.position.z,dd=Math.hypot(dx,dz);
   if(dd<.15){b.path.shift();if(!b.path.length&&b.meet){link(b,b.meet);b.meet=null}}else{const s=Math.min(dd,dt*3);g.position.x+=dx/dd*s;g.position.z+=dz/dd*s;g.rotation.y=Math.atan2(dx,dz)}
   b.legs[0].position.y=.25+Math.abs(Math.sin(t*12))*.2;b.legs[1].position.y=.25+Math.abs(Math.cos(t*12))*.2;g.position.y=.2}
  else{g.position.y=.2+Math.abs(Math.sin(t*2+b.n.length))*.08;if(b.room==b.home)working++}
  g.getWorldPosition(wv);wv.y+=2.9;v.copy(wv).project(cam);b.lbl.style.display=v.z<1?'block':'none';b.lbl.style.left=(v.x+1)/2*innerWidth+'px';b.lbl.style.top=(1-v.y)/2*innerHeight+'px'});
 work.textContent=working;
 for(let i=links.length-1;i>=0;i--){const L=links[i];L.t+=dt;const p=L.ln.geometry.attributes.position;p.setXYZ(0,L.a.g.position.x,1.5,L.a.g.position.z);p.setXYZ(1,L.b.g.position.x,1.5,L.b.g.position.z);p.needsUpdate=true;
  L.ln.material.opacity=(.5+.5*Math.sin(L.t*8))*Math.max(0,1-L.t/4);if(L.t>4){ship.remove(L.ln);L.ln.geometry.dispose();links.splice(i,1)}}
 C.update();R.render(S,cam)});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
fetch('activity.json?'+Date.now()).then(r=>r.json()).then(a=>{a.sort((x,y)=>new Date(y.time)-new Date(x.time));ACT=a;
 a.slice(0,3).forEach(en=>{const b=CREW.find(c=>c.n==en.bot);if(b&&en.room)go(b,en.room)});
 let i=0;const show=()=>{const en=a[i++%Math.min(a.length,8)];ticker.textContent=`📡 ${new Date(en.time).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${en.bot}: ${en.text}`};show();setInterval(show,5000)}).catch(()=>ticker.textContent='No activity yet');
fetch('profits.json?'+Date.now()).then(r=>r.json()).then(p=>{const f=v=>'$'+Number(v).toFixed(2);const s=p.sources;const tot=Object.values(s).reduce((a,b)=>a+ +b,0);
 ptot.textContent=f(tot);pE.textContent=f(s.Etsy||0);pT.textContent=f(s.TikTok||0);pO.textContent=f(s.Other||0);upd.textContent='Profits updated '+p.updated;
 const m=p.mission||{name:'First $25 profit',goal:25};const pc=Math.min(100,tot/m.goal*100);mname.textContent=m.name;mfill.style.width=pc+'%';mpct.textContent=Math.round(pc)+'%'});
